spring:
  application:
    name: payments-ledger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:18201/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASS:ledger}
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:18203}
    consumer:
      group-id: ledger-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  threads:
    virtual:
      enabled: true   # Java 21 virtual threads for all Tomcat request threads

server:
  port: ${SERVER_PORT:18200}

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

ledger:
  api-keys: ${LEDGER_API_KEYS:}   # Comma-separated plain keys; empty = no auth (dev mode)

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n"
  level:
    com.yashash.ledger: INFO
    org.springframework.kafka: WARN
    org.flywaydb: INFO
